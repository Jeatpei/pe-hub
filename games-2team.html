  <script>
    let castleHPs = [100, 100];
    let audioCtx = null;
    function playWhistle(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        if (type === 'short') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'double') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
          const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
          o2.connect(g2); g2.connect(audioCtx.destination); o2.type = 'triangle';
          o2.frequency.setValueAtTime(2600, now + 0.18); g2.gain.setValueAtTime(0.8, now + 0.18);
          g2.gain.exponentialRampToValueAtTime(0.01, now + 0.28); o2.start(now + 0.18); o2.stop(now + 0.28);
        } else if (type === 'long') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6); osc.start(now); osc.stop(now + 0.6);
        }
      } catch (e) {}
    }

    function playTone(freq, dur) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, now); gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + dur); osc.start(now); osc.stop(now + dur);
      } catch (e) {}
    }

    function attackCastle(targetTeam, dmg) {
      castleHPs[targetTeam - 1] = Math.max(0, castleHPs[targetTeam - 1] - dmg);
      playTone(300 + dmg * 20, 0.2);

      const hp = castleHPs[targetTeam - 1];
      document.getElementById(`c2-hp-${targetTeam}`).textContent = hp;
      document.getElementById(`c2-prog-${targetTeam}`).style.width = `${hp}%`;

      if (hp <= 0) {
        playTone(200, 0.6);
        document.getElementById(`c2-icon-${targetTeam}`).textContent = '💥';
        alert(`🔥 城堡被擊破！第 ${targetTeam === 1 ? 2 : 1} 組贏得勝利！`);
      }
    }

    function resetCastleGame() {
      castleHPs = [100, 100];
      for (let i = 1; i <= 2; i++) {
        document.getElementById(`c2-hp-${i}`).textContent = '100';
        document.getElementById(`c2-prog-${i}`).style.width = '100%';
        document.getElementById(`c2-icon-${i}`).textContent = '🏰';
      }
    }

    function toggleGlobalFullscreen() {
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(() => {}); }
      else { document.exitFullscreen().catch(() => {}); }
    }

    window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
  </script>
