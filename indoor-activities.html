    function renderActivities(list) {
      const container = document.getElementById('activitiesGrid');
      if (!container) return;
      container.innerHTML = '';
      list.forEach(act => {
        const card = document.createElement('div');
        card.className = 'bg-slate-900/80 border border-slate-800 p-4 rounded-2xl space-y-2';

        let catColor = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
        if (act.cat === '桌上精細手眼控制') catColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        if (act.cat === '座位走道核心體能') catColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        if (act.cat === '呼吸肌與氣流動力') catColor = 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20';
        if (act.cat === '大腦神經反應抗干擾') catColor = 'bg-purple-500/10 text-purple-400 border-purple-500/20';
        if (act.cat === '團隊連動與倍數合作') catColor = 'bg-rose-500/10 text-rose-400 border-rose-500/20';

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full border ${catColor}">${act.cat}</span>
            <span class="text-xs font-black text-slate-500">#${act.id}</span>
          </div>
          <h4 class="text-sm font-black text-white">${act.name}</h4>
          <div class="text-xs text-slate-400"><strong>教具：</strong>${act.props}</div>
          <p class="text-xs text-slate-300 leading-relaxed">${act.desc}</p>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function filterActivities() {
      const query = document.getElementById('actSearch').value.toLowerCase().trim();
      const cat = document.getElementById('actCatFilter').value;
      const filtered = activities.filter(a => {
        const matchCat = (cat === 'all' || a.cat === cat);
        const matchQuery = (!query || a.name.toLowerCase().includes(query) || a.props.toLowerCase().includes(query) || a.desc.toLowerCase().includes(query));
        return matchCat && matchQuery;
      });
      renderActivities(filtered);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderActivities(activities);
    });
  </script>
