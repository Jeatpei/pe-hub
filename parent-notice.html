    <div class="p-3.5 border-t border-slate-800 bg-slate-950/70 space-y-2">
      <div class="flex items-center justify-between text-xs font-bold text-slate-400">
        <span class="flex items-center gap-1.5"><i data-lucide="volume-2" class="w-3.5 h-3.5 text-sky-400"></i> 電子哨音盤</span>
      </div>
      <div class="grid grid-cols-3 gap-1.5">
        <button onclick="playWhistle('short')" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-[11px] font-black rounded-lg text-slate-200 border border-slate-700 active:scale-95 transition-all">短哨嗶</button>
        <button onclick="playWhistle('double')" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-[11px] font-black rounded-lg text-amber-300 border border-slate-700 active:scale-95 transition-all">雙哨嗶嗶</button>
        <button onclick="playWhistle('long')" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-[11px] font-black rounded-lg text-rose-300 border border-slate-700 active:scale-95 transition-all">長哨嗶—</button>

  <main class="flex-1 flex flex-col overflow-hidden bg-slate-950">
    <header class="h-16 border-b border-slate-800 bg-slate-900/60 backdrop-blur px-8 flex items-center justify-between no-print z-20">
      <div class="flex items-center gap-3">
        <span class="text-xs font-black uppercase tracking-wider bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full border border-emerald-500/20">親師溝通</span>
        <h2 class="text-lg font-black text-white">每週親師通訊小卡產生器 (Parent Newsletter)</h2>
      </div>
    </header>

    <div class="flex-1 p-8 flex flex-col justify-center max-w-3xl mx-auto w-full">
      <div class="bg-slate-900/90 border border-emerald-500/40 rounded-3xl p-8 space-y-6 shadow-2xl">
        <div>
          <span class="px-3 py-1 bg-emerald-500/20 text-emerald-300 font-black text-xs rounded-full">Parent Communication</span>
          <h3 class="text-2xl font-black text-white mt-2">💌 每週親師通訊小卡產生器</h3>
          <p class="text-xs text-slate-300">選擇班級與本週表現，1 秒自動生成 100 字生動活潑的運動動態小短文，方便直接貼入班級群組或聯絡簿！</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
          <div class="space-y-1">
            <label class="font-bold text-slate-300">選擇班級：</label>
            <select id="pnClass" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none">
              <option value="二年1班">二年1班 (201)</option>
              <option value="二年7班">二年7班 (207)</option>
              <option value="二年9班">二年9班 (209)</option>
              <option value="三年2班">三年2班 (302)</option>
              <option value="三年3班">三年3班 (303)</option>
              <option value="三年4班">三年4班 (304)</option>
              <option value="三年5班">三年5班 (305)</option>
              <option value="三年6班">三年6班 (306)</option>
              <option value="三年7班" selected>三年7班 (307)</option>
              <option value="三年8班">三年8班 (308)</option>
            </select>
          </div>

          <div class="space-y-1">
            <label class="font-bold text-slate-300">本週神獸冠軍小隊：</label>
            <select id="pnTeam" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-amber-300 outline-none">
              <option value="🔴 朱雀隊">🔴 第 1 組 朱雀隊</option>
              <option value="🔵 青龍隊" selected>🔵 第 2 組 青龍隊</option>
              <option value="🟡 白虎隊">🟡 第 3 組 白虎隊</option>
              <option value="🟢 玄武隊">🟢 第 4 組 玄武隊</option>
            </select>
          </div>

          <div class="space-y-1 col-span-2">
            <label class="font-bold text-slate-300">本週核心運動技能：</label>
            <input type="text" id="pnSkill" value="手球單手傳接球 ＆ 四大陣地敏捷隊形" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none">
          </div>
        </div>

        <button onclick="generateParentNotice()" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-sm rounded-xl shadow-lg active:scale-95 transition-all">
          ✨ 一秒生成親師通訊稿
        </button>

        <div id="parentNoticeOutputBox" class="hidden space-y-3">
          <div class="p-4 bg-slate-950 border border-emerald-500/30 rounded-2xl text-xs text-slate-200 leading-relaxed font-sans select-all" id="parentNoticeText"></div>
          <button onclick="copyParentNoticeText()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl border border-slate-700 flex items-center justify-center gap-2">
            <i data-lucide="copy" class="w-4 h-4"></i><span>📋 複製親師小卡文字</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function generateParentNotice() {
      const c = document.getElementById('pnClass').value;
      const t = document.getElementById('pnTeam').value;
      const s = document.getElementById('pnSkill').value;
      const text = `【${c} 體育課每週運動動態】\n親愛的家長您好：\n本週體育課孩子們進行了「${s}」挑戰！孩子們全員落實了「鞋帶打雙結」自我安檢，並在團隊對決中展現了極高的集體自律與運動家精神。恭喜本週由 ${t} 榮獲全能體育王冠軍勳章！假日歡迎陪伴孩子到戶外運動，增進親子時光！🏃‍♂️✨`;

      document.getElementById('parentNoticeText').innerText = text;
      document.getElementById('parentNoticeOutputBox').classList.remove('hidden');
    }

    function copyParentNoticeText() {
      const text = document.getElementById('parentNoticeText').innerText;
      navigator.clipboard.writeText(text).then(() => alert('📋 已複製親師小卡文字！'));
    }

    window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
  </script>
</body>
