    function renderQuestions(list) {
      const container = document.getElementById('questionsGrid');
      if (!container) return;
      container.innerHTML = '';
      list.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-900/80 border border-slate-800 p-4 rounded-xl space-y-2';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20">${q.cat}</span>
            <span class="text-xs font-black text-slate-500">Q${idx + 1}</span>
          </div>
          <p class="text-xs font-black text-white">${q.q}</p>
          <div class="grid grid-cols-2 gap-2 text-xs pt-1">
            <div class="p-2 rounded-lg ${q.ans === 1 ? 'bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/40' : 'bg-slate-800 text-slate-400'}">
              1. ${q.o1} ${q.ans === 1 ? '✅' : ''}
            </div>
            <div class="p-2 rounded-lg ${q.ans === 2 ? 'bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/40' : 'bg-slate-800 text-slate-400'}">
              2. ${q.o2} ${q.ans === 2 ? '✅' : ''}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function filterQuestions() {
      const cat = document.getElementById('qCatFilter').value;
      const filtered = (cat === 'all') ? questions : questions.filter(q => q.cat === cat);
      renderQuestions(filtered);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderQuestions(questions);
    });
