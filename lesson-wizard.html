    function playWhistle(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        if (type === 'short') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'double') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
          const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
          o2.connect(g2); g2.connect(audioCtx.destination); o2.type = 'triangle';
          o2.frequency.setValueAtTime(2600, now + 0.18); g2.gain.setValueAtTime(0.8, now + 0.18);
          g2.gain.exponentialRampToValueAtTime(0.01, now + 0.28); o2.start(now + 0.18); o2.stop(now + 0.28);
        } else if (type === 'long') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6); osc.start(now); osc.stop(now + 0.6);
        }
      } catch (e) {}
    }

            </div>
          </div>
        </div>

        <div class="space-y-3 pt-2 border-t border-slate-800">
          <h5 class="text-sm font-black text-white flex items-center gap-2"><i data-lucide="help-circle" class="w-4 h-4 text-purple-400"></i> 課堂檢核 5 題跨領域常規題庫：</h5>
          <div class="grid grid-cols-1 gap-2">${questionsHtml}</div>
        </div>
      `;
      lucide.createIcons();
      box.scrollIntoView({ behavior: 'smooth' });
    }

    function copyGeneratedPlanText() {
      const text = document.getElementById('generatedPlanBox').innerText;
      navigator.clipboard.writeText(text).then(() => alert('📋 教案已成功複製至剪貼簿！'));
    }

    window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
  </script>
</body>
</html>
