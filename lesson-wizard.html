  <script>
    let audioCtx = null;
    function playWhistle(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        if (type === 'short') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'double') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
          const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
          o2.connect(g2); g2.connect(audioCtx.destination); o2.type = 'triangle';
          o2.frequency.setValueAtTime(2600, now + 0.18); g2.gain.setValueAtTime(0.8, now + 0.18);
          g2.gain.exponentialRampToValueAtTime(0.01, now + 0.28); o2.start(now + 0.18); o2.stop(now + 0.28);
        } else if (type === 'long') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6); osc.start(now); osc.stop(now + 0.6);
        }
      } catch (e) {}
    }

    function generateCustomLesson() {
      const venue = document.getElementById('wizVenue').value;
      const target = document.getElementById('wizTarget').value;

      let planTitle = '';
      let coachingCues = '';
      let errorFixes = '';
      let steps = [];

      if (target === 'handball_ball' || venue === 'sunny_outdoor') {
        planTitle = '【手球爭霸：三秒三步衝擊波與敏捷射門】';
        coachingCues = '拿球數三秒、最多走三步、左腳踩右腳跨起跳射門！';
        errorFixes = '衝刺射門踩入6米區（違例）➔ 線外單腳起跳，空中射門後才落地緩衝。';
        steps = [
          { time: '00~05分', phase: '慢跑動態熱身與肩關節旋轉', desc: '雙手引臂過肩拉伸，活化肩胛與腕關節。' },
          { time: '05~15分', phase: '單手肩上傳球與三步上籃步伐', desc: '右撇子依序「左腳踏 ➔ 右腳跨 ➔ 左腳起跳射門」徒手分解練習。' },
          { time: '15~28分', phase: '分組傳射闖關與 5v5 模擬賽', desc: '禁區外起跳射擊九宮格角標，實踐進攻三秒三步與正面防守。' },
          { time: '28~35分', phase: '大螢幕火砲攻城結算', desc: '切換至【大螢幕競技廳】，得分組別拍擊發射重砲！' },
          { time: '35~40分', phase: '肌肉伸展收操與常規致敬', desc: '下肢靜態拉伸、列隊向對手擊掌致敬。' }
        ];
      } else if (target === 'reflex') {
        planTitle = '【特務神經：大腦抗干擾與敏捷反射】';
        coachingCues = '眼睛看手心、耳朵聽指令、口令一出即時反應！';
        errorFixes = '聽口令猶豫慢半拍 ➔ 降低動作幅度，以輕巧前腳掌隨時準備變向。';
        steps = [
          { time: '00~05分', phase: '黑板左右腦手指體操', desc: '左手畫圓右手畫方；口令1摸右耳/2摸左耳/3擊掌。' },
          { time: '05~15分', phase: '反向神經傳導 O/X 線跳躍', desc: '地面畫線，聽問題以跳躍方式選邊，做錯者淘汰回座。' },
          { time: '15~28分', phase: '快手搶拍王桌面對決', desc: '桌面置橡皮擦，聽老師喊「頭、肩膀、腳、搶！」比抓取反射。' },
          { time: '28~35分', phase: '史楚普大螢幕色字對抗', desc: '啟動【大螢幕出題機】進行色字抗干擾搶答！' },
          { time: '35~40分', phase: '手指手腕放鬆收操', desc: '靜態伸展手指與頸部關節，登錄表現積分。' }
        ];
      } else {
        planTitle = '【忍者無聲：教室微空間高心肺潛行】';
        coachingCues = '腳尖著地像貓咪彈簧，大腿抬高碰課本，著地零噪音！';
        errorFixes = '跑步全腳掌重踏發出噪音 ➔ 腳後跟懸空，以前腳掌彈性點地。';
        steps = [
          { time: '00~05分', phase: '座位空中腳踏車', desc: '坐姿雙腳懸空踩踏30秒 + 騰空寫數字，喚醒核心肌群。' },
          { time: '05~15分', phase: '課本登山者快步衝刺', desc: '課本放腿上，高頻抬腿碰課本，比快步聲最小。' },
          { time: '15~28分', phase: '水壺避震跳與教室滑雪', desc: '左右橫跨水壺避震跳，手撐西卡紙走道滑行競速。' },
          { time: '28~35分', phase: '大螢幕神獸能量拍擊', desc: '切換至【大螢幕神獸爭霸】注入能量讓神獸進化！' },
          { time: '35~40分', phase: '深呼吸收操與常規檢核', desc: '大腿前側拉伸、器材歸位。' }
        ];
      }

      const box = document.getElementById('generatedPlanBox');
      box.classList.remove('hidden');

      let stepsHtml = '';
      steps.forEach(s => {
        stepsHtml += `
          <div class="flex items-start gap-3 p-3.5 bg-slate-950/80 rounded-2xl border border-slate-800">
            <span class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 font-black text-xs shrink-0">${s.time}</span>
            <div>
              <div class="font-black text-white text-sm">${s.phase}</div>
              <div class="text-xs text-slate-300 mt-0.5">${s.desc}</div>
            </div>
          </div>
        `;
      });

      box.innerHTML = `
        <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-4 gap-3">
          <div>
            <span class="text-xs font-black text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full uppercase">✨ AI 實戰教案生成成功</span>
            <h4 class="text-2xl font-black text-white mt-1.5">${planTitle}</h4>
          </div>
          <div class="flex items-center gap-2 no-print">
            <button onclick="copyGeneratedPlanText()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold border border-slate-700">📋 複製教案</button>
            <button onclick="window.print()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold border border-slate-700">🖨️ A4列印</button>
            <a href="games-4team.html" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-black">🎮 進入神獸遊戲廳</a>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
          <div class="p-3.5 bg-slate-950/80 rounded-2xl border border-slate-800">
            <span class="font-black text-amber-400">🗣️ 教師引導口訣：</span>
            <p class="text-slate-200 mt-1">${coachingCues}</p>
          </div>
          <div class="p-3.5 bg-slate-950/80 rounded-2xl border border-slate-800">
            <span class="font-black text-rose-400">⚠️ 常見錯誤修正：</span>
            <p class="text-slate-200 mt-1">${errorFixes}</p>
          </div>
        </div>

        <div class="space-y-2.5">
          <div class="text-sm font-black text-white">40 分鐘精確時間軸流程：</div>
          ${stepsHtml}
        </div>
      `;
      lucide.createIcons();
      box.scrollIntoView({ behavior: 'smooth' });
    }

    function copyGeneratedPlanText() {
      const text = document.getElementById('generatedPlanBox').innerText;
      navigator.clipboard.writeText(text).then(() => alert('📋 教案已成功複製至剪貼簿！'));
    }

    window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
  </script>
</body>
</html>
