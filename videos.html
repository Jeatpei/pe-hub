    let audioCtx = null;
    function playWhistle(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        if (type === 'short') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'double') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
          const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
          o2.connect(g2); g2.connect(audioCtx.destination); o2.type = 'triangle';
          o2.frequency.setValueAtTime(2600, now + 0.18); g2.gain.setValueAtTime(0.8, now + 0.18);
          g2.gain.exponentialRampToValueAtTime(0.01, now + 0.28); o2.start(now + 0.18); o2.stop(now + 0.28);
        } else if (type === 'long') {
          osc.frequency.setValueAtTime(2600, now); gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6); osc.start(now); osc.stop(now + 0.6);
        }
      } catch (e) {}
    }

    function renderVideos(list) {

      if (!container) return;
      container.innerHTML = '';
      list.forEach(v => {
        const card = document.createElement('div');
        card.className = 'bg-slate-900/90 border border-slate-800 hover:border-rose-500/40 rounded-3xl p-5 space-y-3 cursor-pointer transition-all shadow-xl flex flex-col justify-between group';
        card.onclick = () => openVideoModal(v);

        let catBadgeColor = 'bg-rose-500/20 text-rose-300 border-rose-500/30';
        if (v.cat === '室內微體能') catBadgeColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30';
        if (v.cat === '常規與安全') catBadgeColor = 'bg-amber-500/20 text-amber-300 border-amber-500/30';
        if (v.cat === '暖身與收操') catBadgeColor = 'bg-sky-500/20 text-sky-300 border-sky-500/30';

        card.innerHTML = `
          <div class="space-y-3">

              </div>
              <span class="absolute bottom-2 right-2 px-2 py-0.5 rounded-md bg-black/80 text-[10px] font-mono text-slate-300">${v.duration}</span>
              <span class="absolute top-2 left-2 text-[11px] font-black px-2 py-0.5 rounded-full border ${catBadgeColor}">${v.badge}</span>
            </div>
            <h3 class="text-sm font-black text-white group-hover:text-rose-400 transition-colors">${v.title}</h3>
            <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">${v.desc}</p>
          </div>

          <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-xs font-bold text-rose-400">
            <span>口訣：${v.cues.split('、')[0]}...</span>
            <span>點擊播放 ➔</span>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function filterVideos() {
      const query = document.getElementById('videoSearch').value.toLowerCase().trim();
      const cat = document.getElementById('videoCatFilter').value;
      const filtered = videos.filter(v => {
        const matchCat = (cat === 'all' || v.cat === cat);
        const matchQuery = (!query || v.title.toLowerCase().includes(query) || v.cues.toLowerCase().includes(query) || v.desc.toLowerCase().includes(query) || v.badge.toLowerCase().includes(query));
        return matchCat && matchQuery;
      });
      renderVideos(filtered);
    }

    function openVideoModal(v) {
      document.getElementById('modalVideoBadge').textContent = v.badge;
      document.getElementById('modalVideoTitle').textContent = v.title;
      document.getElementById('modalVideoPlayerTitle').textContent = v.title;
      document.getElementById('modalVideoDesc').textContent = v.desc;
      document.getElementById('modalVideoCues').textContent = v.cues;
      document.getElementById('modalVideoErrors').textContent = v.errors;
      document.getElementById('videoModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeVideoModal() {
      document.getElementById('videoModal').classList.add('hidden');
    }

    function toggleGlobalFullscreen() {
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(() => {}); }
      else { document.exitFullscreen().catch(() => {}); }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderVideos(videos);
      lucide.createIcons();
    });
